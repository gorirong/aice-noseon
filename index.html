button:disabled{opacity:.5;cursor:default}
/* 진도 노선 */
.route{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.route ol{list-style:none;margin:0;padding:0;display:flex;justify-content:space-between;position:relative}
.route ol::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:4px;margin-top:-2px;background:var(--line);border-radius:2px}
.route li{position:relative}
.route li button{width:26px;height:26px;padding:0;border-radius:50%;border:3px solid var(--line);background:var(--panel);font-size:.72rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

.exam{font-size:.8rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;align-self:flex-start}
pre,code{font-family:var(--f-code)}
pre{margin:0;background:var(--code-bg);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.88rem;line-height:1.5}
code{background:var(--code-bg);padding:0 4px;border-radius:4px;font-size:.9em}
.task{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.task h3{margin:0;font-size:1rem}
.task ul{margin:0;padding-left:1.2em}
textarea{width:100%;box-sizing:border-box;min-height:110px;font-family:var(--f-code);font-size:16px;line-height:1.45;

.out{display:flex;flex-direction:column;gap:8px;min-width:0}

.table{overflow-x:auto;font-size:.82rem}

<script>
// 올릴 수 있는 파일 형식 때문에 .whl/.zip 파일을 .wasm 이름으로 올렸어요. 파이썬이 원래 이름으로 찾으면 바뀐 이름으로 돌려줘요.
const PARTS = {"scikit_learn-1.4.2-cp312-cp312-pyodide_2024_0_wasm32.whl.wasm": 2, "scipy-1.12.0-cp312-cp312-pyodide_2024_0_wasm32.whl.wasm": 4};
(function(){ const f0 = window.fetch.bind(window);
  window.fetch = function(u, o){ let s = (typeof u === 'string') ? u : (u && u.url) || String(u);
    if(/\.(whl|zip)(\?.*)?$/.test(s)) s = s.replace(/\.(whl|zip)(\?.*)?$/, '.$1.wasm$2');
    // 15MB가 넘는 파일은 조각(.p0.wasm, .p1.wasm …)으로 올렸어요. 받아서 하나로 이어 붙여요.
    const base = s.split('?')[0].split('/').pop(), n = PARTS[base];
    if(n){ const head = s.split('?')[0].replace(/\.wasm$/, '');
      return Promise.all(Array.from({length:n}, (_, i)=>f0(head + '.p' + i + '.wasm').then(r=>{ if(!r.ok) throw new Error('조각 ' + i + ' 못 받음'); return r.blob(); })))
        .then(bs=>new Response(new Blob(bs), { status:200, headers:{ 'Content-Type':'application/octet-stream' } })); }
    return f0(s, o); };
})();
</script>

{ title:"함수 부르기", body:`<p><b>함수</b>는 이름 뒤에 괄호를 붙여 부르는 도구예요. 괄호 안에 재료를 넣으면 결과를 돌려줘요. 시험에는 "<b>반올림해서 답안9에 저장</b>" 같은 문제가 나와요.</p>`,
  example:`# 함수 = 이름 뒤에 ( )를 붙여 쓰는 도구. ( ) 안에 재료를 넣으면 결과를 돌려줘요\n\n# round = 반올림 → 4\nprint(round(3.7))\n\n# 쉼표 뒤 숫자 = 소수 몇째 자리까지 → 3.14\nprint(round(3.14159, 2))\n\n# max = 가장 큰 값\nprint(max(4120, 9870))\n\n# min = 가장 작은 값\nprint(min(4120, 9870))\n\n# str = string(문자열). 결과를 글자 '4'로 바꿔요\nprint(str(round(3.7)))`,
  task:{ ask:"평균 승차 인원이 6283.58명이라고 해요. 이 값을 <b>반올림</b>해서 <b>답안5</b>에 저장하세요.", list:["변수명: <code>답안5</code>"],

{ title:"도구 불러오기", exam:"시험 1번 유형", body:`<p>파이썬에 기본으로 없는 기능은 <b>라이브러리</b>(남이 만들어 둔 도구 상자)를 불러와서 써요. 불러오는 방법은 둘 다 맞아요.</p><ul><li><code>import math</code> → 그다음부터 <code>math.sqrt(16)</code>처럼 <b>원래 이름</b>으로 불러요.</li><li><code>import math as m</code> → <b>as</b>는 "별명은 ~로 하자"예요. 그다음부터 <code>m.sqrt(16)</code>처럼 <b>별명</b>으로 불러요. 이때 원래 이름 math는 못 써요(NameError).</li></ul><p><b>점(.)</b>은 "~ 안에 든"이라는 뜻이에요. <code>m.sqrt</code> = m(math 상자) 안에 든 sqrt 도구. sqrt는 square root(제곱근)의 줄임말이에요.</p><p>이름이 길어서 다들 별명을 써요. pandas는 <code>pd</code>, numpy는 <code>np</code>로 거의 정해져 있고, 시험도 "pd로 불러오세요"처럼 별명을 알려 줘요.</p>`,
  example:`# math(수학 도구 상자)를 불러와요\nimport math\n\n# 점(.) = '~ 안의'. math 안의 sqrt(제곱근) → 4.0\nprint(math.sqrt(16))\n\n# as m = '별명은 m으로 하자'. 이제 m이라고 부르면 math예요\nimport math as m\n\n# 별명으로 불러도 결과는 같아요 → 4.0\nprint(m.sqrt(16))`,
  task:{ ask:"표 데이터를 다루는 pandas 라이브러리를 별칭(alias) <b>pd</b>로 불러오세요.", list:["처음엔 준비하느라 몇 초 걸려요."],
    start:"", hint:"import ○○ as ○○", answer:"import pandas as pd", needPandas:true,
    check:`import sys\nok = 'pd' in dir() and getattr(pd,'__name__','') == 'pandas'\nmsg = 'pandas를 pd로 불러왔어요.' if ok else ('pd라는 이름이 없어요. as pd까지 썼는지 보세요.' if 'pd' not in dir() else 'pd가 pandas가 아니에요.')` }},
{ title:"표 읽어 오기", exam:"시험 2번 유형", body:`<p>CSV는 쉼표로 칸을 나눈 표 파일이에요. <code>pd.read_csv('파일이름')</code>으로 읽으면 <b>데이터프레임</b>(엑셀 시트 같은 표)이 돼요. 보통 <code>df</code>라는 변수에 담아요. <code>df.head(5)</code>는 위에서 5줄만 보여 줘요. 칸의 <b>마지막 줄</b>에 쓴 값은 print 없이도 화면에 나와요.</p>`,
  example:`# 표 도구 상자 pandas를 별명 pd로 불러와요\nimport pandas as pd\n\n# pd 안의 read_csv(CSV 읽기)로 파일을 읽어 df에 담아요\ndf = pd.read_csv('subway.csv')\n\n# df 안의 head(머리) 기능: 위에서 2줄만. 마지막 줄은 print 없이도 보여요\ndf.head(2)\n# df = data frame(데이터프레임 = 표)의 줄임말. 다른 이름도 되지만 다들 df라고 써요`,
  task:{ ask:"<b>subway.csv</b> 파일을 읽어 데이터프레임 변수 <b>df</b>에 저장하고, <b>첫 3개 행</b>을 출력하세요.", list:["데이터프레임 변수명: <code>df</code>","파일명: <code>subway.csv</code>","pandas는 이미 pd로 불러와 있어요."],
    start:"", setup:"import pandas as pd", hint:"df = pd.read_csv('subway.csv') 다음 줄에 df.head(3)", answer:"df = pd.read_csv('subway.csv')\ndf.head(3)", needPandas:true,
    check:`import pandas as _pd\nok1 = 'df' in dir() and isinstance(df,_pd.DataFrame) and df.shape == (12,5)\nok2 = isinstance(_, _pd.DataFrame) and len(_) == 3\nok = ok1 and ok2\nmsg = '표를 읽고 첫 3줄을 보여 줬어요.' if ok else ('df에 표가 제대로 안 들어갔어요. 파일 이름의 따옴표와 철자를 보세요.' if not ok1 else '마지막 줄에서 첫 3줄을 보여 줘야 해요. df.head(3)')` }},
{ title:"에러 메시지 읽기", body:`<p>시험장에서는 혼자 에러를 고쳐야 해요. 겁먹지 말고 <b>맨 아래 줄</b>만 보면 돼요.</p><ul><li><b>SyntaxError</b>: 괄호 · 따옴표 짝이 안 맞거나 기호를 빠뜨림</li><li><b>NameError</b>: 그런 이름이 없음(철자, 따옴표 빠뜨림, 불러오기 안 함)</li><li><b>KeyError</b>: 그런 열 이름이 없음</li><li><b>AttributeError</b>: 그런 기능이 없음(점 뒤 철자)</li></ul>`,
  example:`# 일부러 틀린 코드예요. 실행하면 맨 아래 줄에 SyntaxError가 나와요\nprint('괄호를 닫는 걸 잊으면 SyntaxError'`,
  task:{ ask:"<b>오류 고치기</b> 문제예요. 에러가 두 군데 있어요. 고쳐서 df의 첫 5개 행이 나오게 하세요.", list:["pandas는 이미 pd로 불러와 있어요.","하나 고치면 다음 에러가 나와요. 맨 아래 줄을 읽어요."],
    start:"# 아래의 코드를 정정하고 실행하세요.\ndf = pd.read_csv(subway.csv)\ndf.head(5", setup:"import pandas as pd", hint:"파일 이름에 따옴표, head 괄호 닫기", answer:"df = pd.read_csv('subway.csv')\ndf.head(5)", needPandas:true,
    check:`import pandas as _pd\nok = 'df' in dir() and isinstance(df,_pd.DataFrame) and isinstance(_, _pd.DataFrame) and len(_) == 5\nmsg = '두 군데 다 고쳤어요.' if ok else '아직 첫 5개 행이 나오지 않았어요.'` }},
{ title:"표 크기 재기", body:`<p>표를 읽으면 먼저 크기부터 봐요. <code>df.shape</code>는 (행 개수, 열 개수)를 알려 줘요. 괄호 없이 쓰는 점에 주의해요. 행 개수만 원하면 <code>df.shape[0]</code>이나 <code>len(df)</code>를 써요. <code>df.info()</code>는 열마다 빈칸이 몇 개인지까지 보여 줘요.</p>`,
  example:`df = pd.read_csv('subway.csv')\n\n# shape = 모양. (행 개수, 열 개수). 함수가 아니라 표가 가진 정보라서 ( ) 없이 써요\nprint(df.shape)\n\n# [0] = 첫 번째 자리 = 행 개수. [1]이면 열 개수\nprint(df.shape[0])\n\n# len(표) = 행 개수. 바로 위와 같아요\nprint(len(df))\n\n# info = 정보. 열마다 빈칸 아닌 값의 개수와 자료형(int 정수, float 소수, object 글자)\ndf.info()`,

    start:"", setup:"import pandas as pd\ndf = pd.read_csv('subway.csv')", hint:"답안9 = df.shape[0]", answer:"답안9 = df.shape[0]\n답안9_2 = df.shape[1]\nprint(답안9, 답안9_2)", needPandas:true,

{ title:"열 꺼내기", body:`<p>열 하나는 <code>df['열']</code>, 여러 개는 대괄호 <b>두 겹</b> <code>df[['열1', '열2']]</code>이에요. 안쪽 대괄호는 1주차에 배운 리스트예요.</p>`,

{ title:"조건으로 행 거르기", exam:"시험 5번 유형", body:`<p><code>df[조건]</code>은 조건이 맞는 행만 남겨요. 시험의 "<b>300 이상인 행을 삭제</b>"는 거꾸로 "<b>300 미만만 남기기</b>"로 바꿔 쓰는 게 핵심이에요.</p>`,

{ title:"조건 두 개: & 와 |", body:`<p>조건이 둘이면 <code>&</code>(그리고), <code>|</code>(또는)를 쓰고 <b>조건마다 괄호</b>를 쳐요. 파이썬의 and · or는 표에서 쓰면 에러가 나요.</p>`,

{ title:"열 지우기 drop", body:`<p><code>df.drop('열', axis=1)</code>. <b>axis=1이 열, axis=0이 행</b>이에요. 여러 열은 <code>df.drop(columns=['A', 'B'])</code>. 시험 정정 문제에 axis를 틀리게 써 놓는 일이 많아요.</p>`,

{ title:"결측치 세기", exam:"시험 6번 유형", body:`<p><code>df.isnull()</code>은 칸마다 빈칸이면 True. 뒤에 <code>.sum()</code>을 붙이면 <b>열별 개수</b>, 한 번 더 <code>.sum()</code>이면 <b>전체 개수</b>예요.</p>`,
  example:`# 결측치 = 비어 있는 칸. 파이썬에선 NaN(Not a Number)으로 보여요\n\n# isnull = '비었나?'. 칸마다 True(빈칸) / False\nprint(df.isnull().head(6))\n\n# 점을 이어 쓰면 앞 결과에 다음 기능을 써요. True를 1로 세서 열별 합계\nprint(df.isnull().sum())\n\n# 한 번 더 더하면 표 전체 빈칸 수\ndf.isnull().sum().sum()`,

  example:`# 0과 1이 거의 반반\nprint(df['붐빔'].value_counts())\n# stratify = 층을 나누다. stratify=y → y의 0/1 비율대로 공부용 · 시험용에 나눠 담아요\n# 회귀(숫자 맞히기)에선 보통 안 쓰고, 분류(종류 맞히기)에서 써요`,
  task:{ ask:"<b>빈칸 채우기</b>: 붐빔(0/1)을 맞히려고 나눠요. 빈칸을 채워 실행하고, 빈칸 내용을 답안8_1, 답안8_2에 문자열로 쓰세요.", list:["X는 만들어 있어요. y는 붐빔이에요."],
    start:"# 아래 코드의 빈칸을 채우고 실행하세요.\nfrom sklearn.model_selection import train_test_split\ny = df['붐빔']\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, <blank8-1>=y, <blank8-2>=42)\n답안8_1 = ''\n답안8_2 = ''", setup:P3X, hint:"stratify, random_state", answer:"from sklearn.model_selection import train_test_split\ny = df['붐빔']\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)\n답안8_1 = 'stratify'\n답안8_2 = 'random_state'", needSk:true,
    check:IMP+REF_C+`\nok = 'X_test' in dir() and list(X_test.index) == list(_Xte.index) and 답안8_1 == 'stratify' and 답안8_2 == 'random_state'\nmsg = '시험용 12행에도 0과 1이 반씩 들어갔어요.' if ok else '빈칸을 다 고쳤는지, 답안 문자열도 썼는지 보세요.'` }},
{ title:"크기 맞추기 StandardScaler", exam:"시험 9번 유형", body:`<p>기온(-5~32)과 행사(0/1)처럼 열마다 숫자 크기가 다르면 모델이 큰 숫자에 끌려가요. <b>StandardScaler</b>는 열마다 평균 0, 표준편차 1로 바꿔요.</p><p>규칙 하나: 공부용엔 <code>fit_transform</code>(배우고 바꾸기), 시험용엔 <code>transform</code>(바꾸기만). 시험용으로 배우면 커닝이에요.</p>`,
  example:`# preprocessing = 전처리(데이터 다듬기) 칸\nfrom sklearn.preprocessing import StandardScaler\n\n# 도구 이름 뒤 ( ) = 도구 하나를 새로 만들어 scaler에 담아요\nscaler = StandardScaler()\n\n# fit = 공부용의 평균 · 표준편차를 배우고, transform = 그 기준으로 바꾸기\nX_train_s = scaler.fit_transform(X_train)\n\n# 시험용은 배운 기준으로 바꾸기만\nX_test_s = scaler.transform(X_test)\n\n# [:2] = 앞에서 2줄, round(2) = 소수 둘째 자리까지\nprint(X_train_s[:2].round(2))\n# 이름 끝 _s는 scaled(크기 맞춤) 표시일 뿐이에요. 이름은 문제가 정해 줘요`,
  task:{ ask:"StandardScaler로 X_train을 바꿔 <b>X_train_s</b>, X_test를 바꿔 <b>X_test_s</b>에 담으세요.", list:["X_train, X_test는 나눠 놓았어요."],
    start:"from sklearn.preprocessing import StandardScaler\n", setup:P3R, hint:"scaler = StandardScaler() → X_train_s = scaler.fit_transform(X_train) → X_test_s = scaler.transform(X_test)", answer:"from sklearn.preprocessing import StandardScaler\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s = scaler.transform(X_test)", needSk:true,
    check:IMP+REF_R+`\nfrom sklearn.preprocessing import StandardScaler as _SS\n_s = _SS().fit(_Xtr)\nok = 'X_train_s' in dir() and 'X_test_s' in dir() and _np.allclose(X_train_s, _s.transform(_Xtr)) and _np.allclose(X_test_s, _s.transform(_Xte))\nmsg = '공부용으로 배우고 둘 다 바꿨어요.' if ok else '시험용은 transform만 썼는지, 이름이 맞는지 보세요.'` }},
{ title:"커닝 고치기", body:`<p>에러는 안 나는데 <b>틀린 코드</b>도 시험에 나와요. 가장 흔한 게 시험용 데이터로 다시 배우는(fit) 실수예요.</p>`,
  example:`# 맞는 짝\n# 공부용: scaler.fit_transform(X_train)  → 배우고 바꾸기\n# 시험용: scaler.transform(X_test)       → 바꾸기만\n# 시험용으로 fit 하면 '시험 문제를 미리 보고 공부한 것'이 돼요`,
  task:{ ask:"<b>오류 고치기</b>: 아래 코드는 에러 없이 돌지만 틀렸어요. 고쳐서 실행하세요.", list:["어느 줄이 시험용을 '배우고' 있나요?"],
    start:"# 아래의 코드를 정정하고 실행하세요.\nfrom sklearn.preprocessing import StandardScaler\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s = scaler.fit_transform(X_test)", setup:P3R, hint:"마지막 줄의 fit_transform → transform", answer:"from sklearn.preprocessing import StandardScaler\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s = scaler.transform(X_test)", needSk:true,
    check:IMP+REF_R+`\nfrom sklearn.preprocessing import StandardScaler as _SS\n_s = _SS().fit(_Xtr)\nok = 'X_test_s' in dir() and _np.allclose(X_test_s, _s.transform(_Xte))\nmsg = '시험용은 바꾸기만 했어요.' if ok else 'X_test_s가 아직 시험용으로 다시 배운 결과예요.'` }},
{ title:"0~1로 맞추기 MinMaxScaler", body:`<p><b>MinMaxScaler</b>는 열마다 가장 작은 값을 0, 가장 큰 값을 1로 맞춰요. 쓰는 법은 StandardScaler와 똑같고 이름만 달라요. 시험 문제에 적힌 것을 쓰면 돼요.</p>`,
  example:`# Min(가장 작은) Max(가장 큰)\nfrom sklearn.preprocessing import MinMaxScaler\n\n# 이름은 아무거나 괜찮아요 (mm, scaler …)\nmm = MinMaxScaler()\n\n# 열마다 가장 작은 값 → 0, 가장 큰 값 → 1\nprint(mm.fit_transform(X_train)[:2].round(2))`,
  task:{ ask:"MinMaxScaler로 X_train → <b>X_train_m</b>, X_test → <b>X_test_m</b>을 만드세요.", list:[],
    start:"", setup:P3R, hint:"from sklearn.preprocessing import MinMaxScaler", answer:"from sklearn.preprocessing import MinMaxScaler\nmm = MinMaxScaler()\nX_train_m = mm.fit_transform(X_train)\nX_test_m = mm.transform(X_test)\nprint(X_train_m.min(), X_train_m.max())", needSk:true,
    check:IMP+REF_R+`\nfrom sklearn.preprocessing import MinMaxScaler as _MM\n_m = _MM().fit(_Xtr)\nok = 'X_train_m' in dir() and 'X_test_m' in dir() and _np.allclose(X_train_m, _m.transform(_Xtr)) and _np.allclose(X_test_m, _m.transform(_Xte))\nmsg = '공부용은 0~1 안에 들어왔어요.' if ok else 'fit_transform / transform 짝과 이름을 보세요.'` }},
{ title:"3주차 마무리: 한 번에", body:`<p>시험 8~9번 흐름: <b>X, y 만들기 → 나누기 → 크기 맞추기</b>. 다음 주엔 이걸로 모델을 공부시켜요.</p>`,
  example:`# 순서: X, y 만들기 → train_test_split으로 나누기 → scaler로 크기 맞추기\n# 불러오기(import)는 맨 위에 모아 써도 되고, 쓰기 직전에 써도 돼요`,
  task:{ ask:"붐빔을 맞히려 해요. ① X = 혼잡도 · 붐빔을 뺀 열, y = 붐빔 ② 시험용 20%, stratify, random_state=42로 나누기 ③ StandardScaler로 <b>X_train_s</b>, <b>X_test_s</b>", list:["빈 칸에서 시작해요. 불러오기(import)도 직접!"],
    start:"", setup:P3, hint:"3 · 4 · 5 · 6번 역을 이어 붙이면 돼요.", answer:"from sklearn.model_selection import train_test_split\nfrom sklearn.preprocessing import StandardScaler\nX = df.drop(['혼잡도', '붐빔'], axis=1)\ny = df['붐빔']\nX_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)\nscaler = StandardScaler()\nX_train_s = scaler.fit_transform(X_train)\nX_test_s = scaler.transform(X_test)", needSk:true,
    check:IMP+REF_C+`\nfrom sklearn.preprocessing import StandardScaler as _SS\n_s = _SS().fit(_Xtr)\nok = 'X_test_s' in dir() and 'y_test' in dir() and _np.allclose(X_test_s, _s.transform(_Xte)) and list(y_test.index) == list(_yte.index)\nmsg = '세 단계 다 맞아요. 3주차 끝!' if ok else '한 단계씩 확인해요: y는 붐빔, stratify=y, 시험용은 transform.'` }},
];

{ title:"첫 모델: 선형회귀", exam:"시험 10번 유형", body:`<p>모델 쓰는 법은 어느 모델이든 세 줄이에요. <b>만들기</b> <code>model = 모델이름()</code> → <b>공부시키기</b> <code>model.fit(X_train, y_train)</code> → <b>맞히기</b> <code>model.predict(X_test)</code>.</p><p>혼잡도처럼 숫자를 맞히는 건 <b>회귀</b>예요. 가장 기본이 LinearRegression(선형회귀)이에요.</p>`,
  example:`# linear(직선) model 칸에서 LinearRegression(선형회귀)\nfrom sklearn.linear_model import LinearRegression\n\n# 모델 하나 새로 만들기\nmodel = LinearRegression()\n\n# fit = 공부시키기: 재료(X_train)와 정답(y_train)을 같이 줘요\nmodel.fit(X_train, y_train)\n\n# predict = 예측: 시험용 재료만 주고 맞히게 해요\npred = model.predict(X_test)\n\n# pred = prediction(예측)의 줄임말\nprint(pred.round(0))`,

{ title:"얼마나 틀렸나: MAE", exam:"시험 13번 유형", body:`<p>회귀는 <b>평균 오차</b>로 채점해요. <code>mean_absolute_error(y_test, pred)</code> = 정답과 예측의 차이를 평균 낸 값(MAE). 작을수록 좋아요. 순서는 <b>정답 먼저, 예측 나중</b>.</p>`,
  example:`# 진짜 정답 앞 3개 (.values = 표 테두리 없이 값만)\nprint(y_test.values[:3])\n\n# 예측 앞 3개\nprint(pred[:3].round(0))\n# 차이를 모두 양수로 바꿔(절댓값) 평균 낸 게 MAE\n# MAE = Mean(평균) Absolute(절댓값) Error(오차)`,
  task:{ ask:"lr의 예측(pred)이 평균 몇 만큼 틀렸는지 MAE를 구해 <b>답안13</b>에 저장하세요.", list:["mean_absolute_error는 불러와 있어요."],
    start:"", setup:P4LR, hint:"답안13 = mean_absolute_error(y_test, pred)", answer:"답안13 = mean_absolute_error(y_test, pred)\nprint(답안13)", needSk:true,
    check:IMP+REF_R+REF_LR+`\nfrom sklearn.metrics import mean_absolute_error as _mae\nok = '답안13' in dir() and abs(float(답안13) - _mae(_yte, _pred)) < 1e-6\nmsg = '평균 오차를 구했어요.' if ok else 'mean_absolute_error(y_test, pred)를 답안13에 담았는지 보세요.'` }},
{ title:"RMSE 빈칸", body:`<p>또 하나의 채점 방법 <b>RMSE</b>: 오차를 제곱해 평균 낸 값(MSE)에 루트를 씌워요. <code>np.sqrt(mean_squared_error(y_test, pred))</code>. 큰 실수에 더 벌점을 줘요.</p>`,

    start:"# 아래 코드의 빈칸을 채우고 실행하세요.\nimport numpy as np\n답안 = np.<blank13-1>(<blank13-2>(y_test, pred))\n답안13_1 = ''\n답안13_2 = ''", setup:P4LR, hint:"sqrt, mean_squared_error", answer:"import numpy as np\n답안 = np.sqrt(mean_squared_error(y_test, pred))\n답안13_1 = 'sqrt'\n답안13_2 = 'mean_squared_error'", needSk:true,

{ title:"랜덤포레스트 회귀", exam:"시험 10번 유형", body:`<p><b>RandomForest</b>는 작은 나무(결정트리) 여러 그루가 투표하는 모델이에요. 시험에 가장 자주 나와요. 괄호 안에 <code>n_estimators=나무 수</code>, <code>random_state=번호</code>를 문제대로 넣어요. 쓰는 세 줄은 똑같아요.</p>`,
  example:`# ensemble = 여러 모델을 합친 것\nfrom sklearn.ensemble import RandomForestRegressor\n# Random(무작위) Forest(숲): 나무를 무작위로 여러 그루 키워서 평균을 내요\n# Regressor = 회귀(숫자 맞히기)용. 분류용은 Classifier\n\n# n_estimators = 나무 수\nrf = RandomForestRegressor(n_estimators=30, random_state=42)\nprint(rf)`,
  task:{ ask:"<b>RandomForestRegressor(n_estimators=30, random_state=42)</b>를 <b>rf</b>로 만들어 공부시키고, X_test 예측의 MAE를 <b>답안</b>에 저장하세요.", list:["mean_absolute_error는 불러와 있어요.","폰에선 공부에 몇 초 걸려요."],
    start:"from sklearn.ensemble import RandomForestRegressor\n", setup:P4R, hint:"rf.fit(X_train, y_train) → pred_rf = rf.predict(X_test) → 답안 = mean_absolute_error(y_test, pred_rf)", answer:"from sklearn.ensemble import RandomForestRegressor\nrf = RandomForestRegressor(n_estimators=30, random_state=42)\nrf.fit(X_train, y_train)\npred_rf = rf.predict(X_test)\n답안 = mean_absolute_error(y_test, pred_rf)\nprint(답안)", needSk:true,
    check:IMP+REF_R+`\nfrom sklearn.ensemble import RandomForestRegressor as _RFR\nfrom sklearn.metrics import mean_absolute_error as _mae\n_p = _RFR(n_estimators=30, random_state=42).fit(_Xtr, _ytr).predict(_Xte)\nok = 'rf' in dir() and '답안' in dir() and abs(float(답안) - _mae(_yte, _p)) < 1e-6\nmsg = '나무 30그루의 평균 오차예요. 선형회귀와 비교해 보세요.' if ok else 'n_estimators=30, random_state=42와 MAE 순서(y_test, 예측)를 보세요.'` }},
{ title:"가장 중요한 열", exam:"시험 11번 유형", body:`<p>공부를 마친 나무 모델은 <code>model.feature_importances_</code>에 열마다 얼마나 중요했는지 숫자를 갖고 있어요. 열 이름과 짝지어 가장 큰 걸 고르면 돼요: <code>pd.Series(값, index=X_train.columns)</code>.</p>`,

const ERR_KO = {
  SyntaxError:'괄호나 따옴표 짝이 안 맞거나, 기호를 빠뜨렸어요.',
  IndentationError:'줄 앞 빈칸(들여쓰기)이 이상해요. 줄 맨 앞의 빈칸을 지워 보세요.',
  NameError:'그런 이름이 없어요. 철자, 따옴표, import를 확인하세요.',
  KeyError:'그런 열 이름이 없어요. 철자와 대소문자를 보세요.',
  AttributeError:'점 뒤에 쓴 기능 이름이 없어요. 철자를 보세요.',
  TypeError:'값의 종류가 맞지 않아요. 글자와 숫자를 섞었거나 괄호 안 재료가 틀렸어요.',
  FileNotFoundError:'그런 파일이 없어요. 파일 이름 철자를 보세요.',
  ModuleNotFoundError:'그런 라이브러리가 없어요. 이름 철자를 보세요.',
  ZeroDivisionError:'0으로 나눴어요.',
  ValueError:'값이 맞지 않아요. 넣은 재료의 개수나 모양(공부용 · 시험용 짝)을 보세요.',
};
function explainError(msg){
  const lines = msg.trim().split('\n');
  let last = lines[lines.length-1];
  // 사용자에게 보여 줄 줄 번호 찾기
  let lineNo = null;
  for(const l of lines){ const m = l.match(/File "<exec>", line (\d+)/); if(m) lineNo = m[1]; }
  const kind = (last.match(/^(\w+Error)/)||[])[1];
  return { last, lineNo, ko: ERR_KO[kind] || '' };
}

async function runCode(code, opts){
  const needPandas = opts.needPandas || /pandas|\bpd\./.test(code);
  const py = opts.needSk ? await getSk() : needPandas ? await getPandas() : await getPy();
  let out = [];
  py.setStdout({ batched: s=>out.push(s) });
  py.setStderr({ batched: s=>out.push(s) });
  const ns = py.globals.get('dict')();
  let value = null, error = null, html = null, repr = null;
  try{
    if(opts.setup) await py.runPythonAsync(opts.setup, { globals: ns });
    value = await py.runPythonAsync(code, { globals: ns });
    if(value !== undefined && value !== null){
      if(value && value.type === 'DataFrame'){ html = value.to_html.callKwargs({max_rows:15}); }
      else if(value && value.type === 'Series'){ const fr = value.to_frame(); html = fr.to_html.callKwargs({max_rows:15}); fr.destroy(); }
      else if(value && typeof value === 'object' && value.toString){ repr = py.globals.get('repr')(value); }
      else { repr = String(value); }
    }
  }catch(e){ error = e.message || String(e); }
  let verdict = null;
  if(opts.check && !error){
    try{
      ns.set('_', value === undefined ? null : value);
      ns.set('_out', out.join('\n'));
      // numpy의 참/거짓은 JS에서 언제나 '있음'으로 보여서, 파이썬 bool로 바꿔서 꺼낸다
      await py.runPythonAsync(opts.check + "\nok = bool(ok)\nmsg = str(msg)", { globals: ns });
      verdict = { ok: !!ns.get('ok'), msg: String(ns.get('msg')) };
    }catch(e){ verdict = { ok:false, msg:'채점 중 문제가 생겼어요: ' + (e.message||'').trim().split('\n').pop() }; }
  }
  if(value && value.destroy) try{ value.destroy() }catch(e){}
  ns.destroy && ns.destroy();
  return { out: out.join('\n'), error, html, repr, verdict };
}

function renderResult(box, r, isTask){
  box.innerHTML = '';
  if(r.out){ const p = document.createElement('pre'); p.textContent = r.out; box.append(p); }
  if(r.html){ const d = document.createElement('div'); d.className='table'; d.innerHTML = r.html; box.append(d); }
  else if(r.repr && r.repr !== 'None'){ const p = document.createElement('pre'); p.textContent = r.repr; box.append(p); }
  if(r.error){
    const ex = explainError(r.error);
    const p = document.createElement('pre'); p.className='err';
    p.textContent = (ex.lineNo ? ex.lineNo + '번째 줄에서 에러\n' : '') + ex.last;
    box.append(p);
    if(ex.ko){ const v = document.createElement('div'); v.className='verdict bad'; v.textContent = '풀이: ' + ex.ko; box.append(v); }
  }
  if(isTask && r.verdict){
    const v = document.createElement('div'); v.className = 'verdict ' + (r.verdict.ok?'ok':'bad');
    v.textContent = (r.verdict.ok ? '정답이에요. ' : '아직이에요. ') + r.verdict.msg; box.append(v);
  }
  if(!r.out && !r.html && !r.error && !(r.repr && r.repr!=='None') && !(isTask && r.verdict)){
    const p = document.createElement('p'); p.className='note'; p.textContent='실행했어요. 화면에 보여 줄 것은 없어요.'; box.append(p);
  }
}

function insertAt(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0,s) + text + ta.value.slice(e);
  const pos = s + text.length; ta.setSelectionRange(pos,pos); ta.dispatchEvent(new Event('input'));
}

    if(L.week !== wk) return;
    const li = document.createElement('li');
    if(done[i]) li.classList.add('done');
    if(i===cur) li.classList.add('here');
    const b = document.createElement('button'); b.textContent = i+1;
    b.setAttribute('aria-label', (i+1)+'번 역 '+L.title+(done[i]?' (통과)':''));
    b.onclick = ()=>{ cur=i; draw(); };
    li.append(b); route.append(li);
  });
}
function draw(){
  try{ localStorage.setItem('aice-w1-cur', String(cur)) }catch(e){}
  drawRoute();
  const L = LESSONS[cur], T = L.task;
  learn.innerHTML = `
  <article class="card">
    <div class="eyebrow">${L.week}주차 · ${cur+1}번 역</div>
    ${L.exam ? `<span class="exam">${L.exam}</span>` : ''}
    <h2>${L.title}</h2>
    ${L.body}
    <div class="eyebrow">보기 코드</div>
    <pre id="ex-code"></pre>
    <div class="row"><button id="ex-run">보기 실행</button></div>
    <div class="out" id="ex-out"></div>
    <section class="task">
      <h3>직접 해 보기</h3>
      <p>${T.ask}</p>
      <ul>${T.list.map(x=>`<li>${x}</li>`).join('')}</ul>
      <label for="code-${cur}" class="note">답안 칸</label>
      <textarea id="code-${cur}" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="keys" id="keys"></div>
      <div class="row">
        <button class="primary" id="run">실행하고 채점</button>
        <button id="hint">힌트</button>
        <button id="show">정답 보기</button>
        <button id="reset">처음으로</button>
      </div>
      <p class="note" id="hint-box" hidden></p>
      <div class="out" id="out"></div>
    </section>
  </article>
  <div class="nav">
    <button id="prev" ${cur===0?'disabled':''}>← 이전 역</button>
    <button id="next" ${cur===LESSONS.length-1?'disabled':''}>다음 역 →</button>
  </div>`;
  { const exEl = document.getElementById('ex-code'); exEl.textContent = '';
    L.example.split('\n').forEach((ln, k)=>{ if(k) exEl.append('\n'); if(ln.trim().startsWith('#')){ const sp = document.createElement('span'); sp.className = 'cm'; sp.textContent = ln; exEl.append(sp); } else exEl.append(ln); }); }
  const ta = document.getElementById('code-'+cur);
  ta.value = drafts[cur] ?? T.start;
  ta.addEventListener('input', ()=>saveDraft(cur, ta.value));
  const keys = document.getElementById('keys');
  [...KEYS.map(k=>[k,k,false]), ['↹','    ',false], ['줄바꿈','\n',true], ...WORDS.map(w=>[w,w,true])].forEach(([label,text,word])=>{
    const b = document.createElement('button'); b.type='button'; b.textContent=label; if(word) b.className='word';
    b.setAttribute('aria-label', label+' 넣기');
    b.addEventListener('pointerdown', e=>e.preventDefault());
    b.addEventListener('click', ()=>{ ta.focus(); insertAt(ta, text); });
    keys.append(b);
  });
  const exBtn = document.getElementById('ex-run');
  exBtn.onclick = async ()=>{
    exBtn.disabled = true; exBtn.textContent = '실행 중…';
    try{ renderResult(document.getElementById('ex-out'), await runCode(L.example, T.needSk ? { needSk:true, setup:T.setup } : { needPandas: !!T.needPandas, setup: T.setup || (T.needPandas ? 'import pandas as pd' : undefined) }), false); }
    catch(e){ document.getElementById('ex-out').textContent = '실행하지 못했어요.'; }
    exBtn.disabled = false; exBtn.textContent = '보기 실행';
  };
  const runBtn = document.getElementById('run');
  runBtn.onclick = async ()=>{
    runBtn.disabled = true; runBtn.textContent = '실행 중…';
    try{
      const r = await runCode(ta.value, { setup:T.setup, check:T.check, needPandas:T.needPandas, needSk:T.needSk });
      renderResult(document.getElementById('out'), r, true);
      if(r.verdict && r.verdict.ok && !done[cur]){ done[cur]=true; saveDone(); drawRoute(); }
    }catch(e){ document.getElementById('out').textContent = '실행하지 못했어요. 아래 안내를 보세요.'; }
    runBtn.disabled = false; runBtn.textContent = '실행하고 채점';
  };
  document.getElementById('hint').onclick = ()=>{ const h=document.getElementById('hint-box'); h.hidden=false; h.textContent='힌트: '+T.hint; };
  document.getElementById('show').onclick = ()=>{ const h=document.getElementById('hint-box'); h.hidden=false; h.innerHTML=''; const p=document.createElement('pre'); p.textContent=T.answer; h.append('정답 예시 (보고 나서 직접 쳐 보세요)', p); };
  document.getElementById('reset').onclick = ()=>{ ta.value = T.start; saveDraft(cur, ta.value); document.getElementById('out').innerHTML=''; };
  document.getElementById('prev').onclick = ()=>{ if(cur>0){ cur--; draw(); window.scrollTo(0,0); } };
  document.getElementById('next').onclick = ()=>{ if(cur<LESSONS.length-1){ cur++; draw(); window.scrollTo(0,0); } };
}

// 복습 카드
const flashlist = document.getElementById('flashlist');
FLASH.forEach(([f,b])=>{
  const btn = document.createElement('button'); btn.setAttribute('aria-pressed','false');
  btn.innerHTML = `<span class="front"></span><span class="back" hidden></span>`;
  btn.querySelector('.front').textContent = f; btn.querySelector('.back').textContent = b;
  btn.onclick = ()=>{ const bk=btn.querySelector('.back'); bk.hidden=!bk.hidden; btn.setAttribute('aria-pressed', String(!bk.hidden)); };
  flashlist.append(btn);
});
const tabF = document.getElementById('tab-flash');
const WEEKS = [1,2,3,4];
function setTab(which){
  WEEKS.forEach(w=>document.getElementById('tab-w'+w).setAttribute('aria-pressed', String(which==='w'+w))); tabF.setAttribute('aria-pressed', String(which==='flash'));
  const learning = which !== 'flash';
  document.getElementById('learn').hidden = !learning; document.querySelector('.route').hidden = !learning; document.getElementById('flash').hidden = learning;
}
function openWeek(w){
  if(LESSONS[cur].week !== w){
    // 그 주차에서 아직 안 푼 첫 역, 다 풀었으면 첫 역
    const idx = LESSONS.map((L,i)=>i).filter(i=>LESSONS[i].week===w);
    cur = idx.find(i=>!done[i]) ?? idx[0];
  }
  setTab('w'+w); draw(); window.scrollTo(0,0);
}
WEEKS.forEach(w=>{ document.getElementById('tab-w'+w).onclick = ()=>openWeek(w); });
tabF.onclick = ()=>setTab('flash');
const _origDraw = draw;
draw = function(){ _origDraw(); setTab('w'+LESSONS[cur].week); };

draw();
</script>

<p id="offline-msg" style="position:fixed;left:8px;right:8px;bottom:8px;margin:0;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:.85rem;z-index:20" hidden></p>
<script>
// 인터넷 없이 쓰려고 파일을 휴대폰에 모두 받아 두는 부분 (처음 한 번, 약 100MB)
(function(){
  const m = document.getElementById('offline-msg');
  function say(t, keep){ m.textContent = t; m.hidden = false; if(!keep) setTimeout(()=>{ m.hidden = true }, 6000); }
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.addEventListener('message', e=>{
    const d = e.data || {};
    if(d.type === 'progress') say('인터넷 없이 쓰려고 받는 중… ' + d.done + ' / ' + d.total + ' (와이파이에서 화면을 켜 두세요)', true);
    if(d.type === 'ready') say('다 받았어요. 이제 인터넷 없이도 돼요.');
    if(d.type === 'fail') say('받다가 끊겼어요. 와이파이에서 다시 열면 이어서 받아요.');
  });
  navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{
    if(r.active) r.active.postMessage('check');
  }).catch(()=>{});
})();
</script>
